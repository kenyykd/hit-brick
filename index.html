<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e16" />
    <title>打磚塊</title>
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <div id="stage">
          <canvas id="game"></canvas>
          <div class="hud" aria-live="polite">
            <span id="hud-score">分數 0</span>
            <span id="hud-level">第 1 關</span>
            <span id="hud-lives">生命 3</span>
          </div>
          <div id="overlay" class="overlay ui" hidden>
            <div class="panel">
              <h2 id="overlay-title"></h2>
              <p id="overlay-score"></p>
              <div class="buttons">
                <button id="overlay-next" type="button">下一關</button>
                <button id="overlay-restart" type="button" class="secondary">再玩一次</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="rotate-hint">請把手機轉回直式</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
